# VPS-Variante für Server mit laufendem Coolify/Traefik (keine eigenen Host-Ports!).
#   docker compose -f docker-compose.vps.yml up -d --build
# Mit Domain/TLS zusätzlich:
#   docker compose -f docker-compose.vps.yml -f docker-compose.vps-tls.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    container_name: hs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - hs_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hs-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_PORT: "3001"
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NODE_ENV: production

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hs-web
    restart: unless-stopped
    depends_on:
      - api
    # bewusst keine Host-Ports — Routing über Traefik (siehe vps-tls)

  backup:
    image: postgres:16-alpine
    container_name: hs-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          pg_dump -h db -U ${POSTGRES_USER} ${POSTGRES_DB} | gzip > /backups/hotel_$$(date +%Y%m%d_%H%M%S).sql.gz
          find /backups -name "*.sql.gz" -mtime +30 -delete
          sleep 86400
        done

volumes:
  hs_db_data:
